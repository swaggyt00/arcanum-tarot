name: Verify real Groq tarot reading (one-time)
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-tarot-live-once.yml"]
permissions:
  contents: read
jobs:
  live-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Query real public AI (one synthetic test reading)
        run: |
          node --input-type=module <<'NODE'
          const cards=[
            {name:'Маг',position:'Суть ситуации',orientation:'перевёрнутая',meaning:'Неуверенность и нехватка контроля',suit:'Старшие арканы',arcana:'major',archetype:'инициатор'},
            {name:'Десятка Кубков',position:'Что помогает',orientation:'прямая',meaning:'Поддержка и согласие',suit:'Кубков',arcana:'minor',archetype:'единство'},
            {name:'Паж Мечей',position:'Что мешает',orientation:'перевёрнутая',meaning:'Разрозненная информация',suit:'Мечей',arcana:'minor',archetype:'наблюдатель'},
            {name:'Тройка Жезлов',position:'Скрытый фактор',orientation:'прямая',meaning:'Долгосрочная перспектива',suit:'Жезлов',arcana:'minor',archetype:'исследователь'},
            {name:'Туз Пентаклей',position:'Совет и возможный вектор',orientation:'перевёрнутая',meaning:'Задержка материального результата',suit:'Пентаклей',arcana:'minor',archetype:'возможность'}
          ];
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),135000);
          let response;
          try{
            response=await fetch('https://arcanum-tarot-ai.kunicin27522.workers.dev/',{
              method:'POST',headers:{'Origin':'https://swaggyt00.github.io','Content-Type':'application/json'},
              body:JSON.stringify({question:'Смогу ли я купить машину мечты в ближайший год?',category:'Деньги',cards}),
              signal:controller.signal
            });
          }finally{clearTimeout(timer)}
          const data=await response.json();
          if(!response.ok)throw Error('Worker '+response.status+': '+String(data.error||'unknown'));
          const a=data.analysis;
          if(!a||a.cards?.length!==5||!a.answer||!a.pattern)throw Error('Incomplete analysis JSON');
          const sizes={answer:a.answer.length,pattern:a.pattern.length,eachCard:a.cards.map(x=>x.insight.length),nextStep:a.nextStep.length,uncertainty:a.uncertainty.length};
          console.log('Model:',data.model);
          console.log('Sizes:',JSON.stringify(sizes));
          console.log('Answer:',a.answer);
          console.log('Connections:',a.pattern);
          if(sizes.answer<110||sizes.pattern<150||Math.min(...sizes.eachCard)<95)throw Error('Generated reading too shallow; needs prompt improvements');
          NODE
