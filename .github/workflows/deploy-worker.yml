name: Deploy ARCAnum AI Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: arcanum-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set repository secret CLOUDFLARE_API_TOKEN before deployment."
            exit 1
          fi
      - name: Setup Node for worker tests and live smoke
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run Worker unit tests
        working-directory: worker
        run: npm test
      - name: Deploy existing Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 98bfa1862ebd92f0b5ec8bc3d56413e5
          wranglerVersion: "4.158.0"
          workingDirectory: worker
          command: deploy
      - name: Verify game AI Director responds with real Groq selection
        run: node worker/smoke-game-live.mjs
